name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          cd code/pomimi.swiftpm
          xcodebuild archive \
            -scheme "Pomimi" \
            -destination "generic/platform=iOS" \
            -archivePath "../../Pomimi.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Pomimi.xcarchive/Products/Applications -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Archive finished but no .app was found."
            exit 1
          fi
          
          # Get the exact name of the compiled executable to prevent mismatch errors
          EXEC_NAME=$(basename "$APP_PATH" .app)
          
          # Write Info.plist line-by-line to guarantee zero blank spaces breaking the XML
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?>' > "$APP_PATH/Info.plist"
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$APP_PATH/Info.plist"
            echo '<plist version="1.0"><dict>' >> "$APP_PATH/Info.plist"
            echo '<key>CFBundleExecutable</key><string>'$EXEC_NAME'</string>' >> "$APP_PATH/Info.plist"
            echo '<key>CFBundleIdentifier</key><string>com.local.pomimi</string>' >> "$APP_PATH/Info.plist"
            echo '<key>CFBundleName</key><string>'$EXEC_NAME'</string>' >> "$APP_PATH/Info.plist"
            echo '<key>CFBundleVersion</key><string>1</string>' >> "$APP_PATH/Info.plist"
            echo '<key>CFBundleShortVersionString</key><string>1.0</string>' >> "$APP_PATH/Info.plist"
            echo '<key>CFBundlePackageType</key><string>APPL</string>' >> "$APP_PATH/Info.plist"
            echo '<key>LSRequiresIPhoneOS</key><true/>' >> "$APP_PATH/Info.plist"
            echo '<key>MinimumOSVersion</key><string>16.0</string>' >> "$APP_PATH/Info.plist"
            echo '</dict></plist>' >> "$APP_PATH/Info.plist"
          fi
          
          cp -a "$APP_PATH" Payload/
          zip -ry Pomimi.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: Pomimi.ipa
