name: Build unsigned IPA

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [main]

env:
  # --- EDIT THESE ---
  PROJECT: YourApp.xcodeproj        # or set WORKSPACE below instead
  WORKSPACE: ""                     # e.g. YourApp.xcworkspace (leave empty if not used)
  SCHEME: YourApp
  CONFIGURATION: Release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version and schemes
        run: |
          xcodebuild -version
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -list -workspace "$WORKSPACE"
          else
            xcodebuild -list -project "$PROJECT"
          fi

      # If you use CocoaPods, uncomment:
      # - name: Install Pods
      #   run: pod install

      - name: Build (no code signing)
        run: |
          if [ -n "$WORKSPACE" ]; then
            TARGET_FLAG="-workspace $WORKSPACE"
          else
            TARGET_FLAG="-project $PROJECT"
          fi
          xcodebuild $TARGET_FLAG \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "${SCHEME}-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}-unsigned-ipa
          path: ${{ env.SCHEME }}-unsigned.ipa
          if-no-files-found: error

# ---------------------------------------------------------------
# FLUTTER? Replace the "Build" step with these two steps:
#
#      - uses: subosito/flutter-action@v2
#        with:
#          channel: stable
#      - run: flutter build ios --release --no-codesign
#
# and change the app lookup in "Package IPA" to:
#      APP_PATH=build/ios/iphoneos/Runner.app
#
# REACT NATIVE? Run `npm ci` and `cd ios && pod install` first,
# then use the native xcodebuild step above with your .xcworkspace.
# ---------------------------------------------------------------
