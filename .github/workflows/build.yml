name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          cd code/pomimi.swiftpm
          # Archiving forces Xcode to fully assemble the app bundle and Info.plist
          xcodebuild archive \
            -scheme "Pomimi" \
            -destination "generic/platform=iOS" \
            -archivePath "../../Pomimi.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          
          # The fully assembled .app is neatly stored inside the archive's Products folder
          APP_PATH=$(find Pomimi.xcarchive/Products/Applications -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Archive finished but no .app was found."
            exit 1
          fi
          
          cp -a "$APP_PATH" Payload/
          zip -ry Pomimi.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: Pomimi.ipa
