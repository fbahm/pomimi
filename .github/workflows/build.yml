name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App for iOS
        run: |
          cd code/pomimi.swiftpm
          xcodebuild build \
            -scheme "Pomimi" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package strict IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*/Build/Products/Release-iphoneos/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Build finished but no .app was found."
            exit 1
          fi
          
          echo "Found compiled app at: $APP_PATH"
          
          # Print bundle contents to GitHub logs for debugging
          echo "--- APP BUNDLE CONTENTS ---"
          ls -la "$APP_PATH"
          echo "---------------------------"

          EXEC_NAME=$(basename "$APP_PATH" .app)
          
          echo '<?xml version="1.0" encoding="UTF-8"?>' > "$APP_PATH/Info.plist"
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$APP_PATH/Info.plist"
          echo '<plist version="1.0"><dict>' >> "$APP_PATH/Info.plist"
          echo '<key>CFBundleExecutable</key><string>'$EXEC_NAME'</string>' >> "$APP_PATH/Info.plist"
          echo '<key>CFBundleIdentifier</key><string>com.local.pomimi</string>' >> "$APP_PATH/Info.plist"
          echo '<key>CFBundleName</key><string>'$EXEC_NAME'</string>' >> "$APP_PATH/Info.plist"
          echo '<key>CFBundleVersion</key><string>1</string>' >> "$APP_PATH/Info.plist"
          echo '<key>CFBundleShortVersionString</key><string>1.0</string>' >> "$APP_PATH/Info.plist"
          echo '<key>CFBundlePackageType</key><string>APPL</string>' >> "$APP_PATH/Info.plist"
          echo '<key>LSRequiresIPhoneOS</key><true/>' >> "$APP_PATH/Info.plist"
          echo '<key>MinimumOSVersion</key><string>16.0</string>' >> "$APP_PATH/Info.plist"
          echo '<key>UILaunchScreen</key><dict/>' >> "$APP_PATH/Info.plist"
          echo '<key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>' >> "$APP_PATH/Info.plist"
          echo '</dict></plist>' >> "$APP_PATH/Info.plist"

          mkdir -p Payload
          cp -a "$APP_PATH" Payload/
          
          # Safely use python on a single line without breaking YAML indentation
          python3 -c "import shutil; shutil.make_archive('Pomimi', 'zip', '.', 'Payload')"
          mv Pomimi.zip Pomimi.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: Pomimi.ipa
