name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App
        run: |
          cd code/pomimi.swiftpm
          xcodebuild -scheme "Pomimi" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          
          # Strictly find the final compiled app, ignoring intermediate folders
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*/Build/Products/Release-iphoneos/*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Build finished but no valid .app was found in Products."
            exit 1
          fi
          
          # Use -a to preserve attributes and -y to preserve symlinks
          cp -a "$APP_PATH" build/Payload/
          cd build && zip -ry Pomimi.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/*.ipa
