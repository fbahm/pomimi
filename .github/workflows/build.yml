name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          cd code/pomimi.swiftpm
          xcodebuild archive \
            -scheme "Pomimi" \
            -destination "generic/platform=iOS" \
            -archivePath "../../Pomimi.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Pomimi.xcarchive/Products/Applications -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Archive finished but no .app was found."
            exit 1
          fi
          
          # Inject Info.plist safely using echo instead of a bash heredoc
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleExecutable</key>
                <string>Pomimi</string>
                <key>CFBundleIdentifier</key>
                <string>com.local.Pomimi</string>
                <key>CFBundleName</key>
                <string>Pomimi</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>LSRequiresIPhoneOS</key>
                <true/>
                <key>MinimumOSVersion</key>
                <string>16.0</string>
            </dict>
            </plist>' > "$APP_PATH/Info.plist"
          fi
          
          cp -a "$APP_PATH" Payload/
          zip -ry Pomimi.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: Pomimi.ipa
