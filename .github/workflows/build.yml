name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate Swift Package
        id: find_pkg
        run: |
          # Find directory containing Package.swift
          PKG_DIR=$(find . -name "Package.swift" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$PKG_DIR" ]; then
            echo "::error::Could not find Package.swift in the repository."
            exit 1
          fi
          echo "pkg_dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          echo "Found package at: $PKG_DIR"

      - name: Build App
        run: |
          PKG_DIR="${{ steps.find_pkg.outputs.pkg_dir }}"
          xcodebuild -package-path "$PKG_DIR" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Build succeeded but no .app was found."
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r Pomimi.ipa Payload/

      - name: Upload IPA to Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/*.ipa
